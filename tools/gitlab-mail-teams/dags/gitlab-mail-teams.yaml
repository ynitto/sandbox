# gitlab-mail-teams を Dagu で回す例（~/.config/dagu/dags/gitlab-mail-teams.yaml にコピーして使う）。
# 受信フォルダに置かれた GitLab の通知メール（.eml）を 1 通ずつ Teams の Adaptive Card の JSON に変換する。
#   convert  inbox の *.eml を順に変換し、<同じ名前>.json を cards に書く。
#            変換できたメールは done へ、読めなかったメール（終了コード 2）は failed へ移す。
#            1 通でも読めなければステップは失敗になり、Dagu の履歴に残る（残りのメールは最後まで処理する）。
# .eml を inbox に置くところと、cards の JSON を Teams に投稿するところは Power Automate の側で組む（README の「社内での組み立て方」）。
# スクリプト先頭の 5 つのパス（tool・inbox・cards・processed・failed）を自分の環境に直す。~ は使わず絶対パスで書く。
# 前の回がまだ終わっていないときは、flock で重なりを避けて何もせずに正常終了する（同じメールを二重に処理しない）。
# flock が無い環境（macOS など）では、lock の 3 行を外すか別の排他の手段に置き換える。
# Windows で動かすなら、同じ処理を PowerShell の foreach に書き換える（command を powershell に、python3 を python に）。
description: "GitLab の通知メールを Teams のカードに変換する"
schedule: "*/5 * * * *"
type: graph
hist_retention_days: 14
steps:
  - name: convert
    action: exec
    with:
      command: sh
      args:
        - "-c"
        - |
          tool=/home/you/sandbox-repo/tools/gitlab-mail-teams/gitlab_mail_teams.py
          inbox=/home/you/OneDrive/gitlab-mail/inbox
          cards=/home/you/OneDrive/gitlab-mail/cards
          processed=/home/you/OneDrive/gitlab-mail/done
          failed=/home/you/OneDrive/gitlab-mail/failed
          lock=/tmp/gitlab-mail-teams.lock
          exec 9>"$lock"
          flock -n 9 || { echo "前の回がまだ動いているので、今回は何もしません"; exit 0; }
          mkdir -p "$cards" "$processed" "$failed"
          rc=0
          for eml in "$inbox"/*.eml; do
            [ -e "$eml" ] || continue            # 1 通も無いとき
            name=$(basename "$eml" .eml)
            # 書きかけを Power Automate に拾われないよう、.tmp に書いてから名前を変える
            if python3 "$tool" "$eml" --format card > "$cards/$name.json.tmp"; then
              mv "$cards/$name.json.tmp" "$cards/$name.json"
              mv "$eml" "$processed/"
            else
              rm -f "$cards/$name.json.tmp"
              mv "$eml" "$failed/"
              rc=1
            fi
          done
          exit $rc
    timeout_sec: 300
