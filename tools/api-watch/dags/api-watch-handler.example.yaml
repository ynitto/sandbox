# 受け渡し先（後続処理）の DAG の例（Dagu v2 の書式）。ファイル名が DAG 名になる（この例なら
# api-watch-handler.example。使うときはルールの targets の workflow と同じ名前で保存する）。
# 設定は delivery.adapter: dagu（api-watch を --plugin dagu で動かす）。
#
# api-watch は `dagu enqueue --run-id=<受け渡しの ID>` でこの DAG をキューに入れ、次の引数を渡す:
#   APIWATCH_EVENT_ID     イベント ID（同じイベントを複数の DAG に渡しても同じ）
#   APIWATCH_DELIVERY_ID  受け渡しの ID（= この実行の DAG_RUN_ID。渡し直しても変わらない）
#   APIWATCH_SOURCE / APIWATCH_RULE / APIWATCH_RECORD_ID / APIWATCH_KINDS
#   APIWATCH_EVENT_FILE   イベントの中身（変更前後の値・変更箇所・レコード）の JSON ファイル
# ルールの targets[].params に書いた引数も同じ形で届く。ack は接続設定を使わないので --connections は要らない。
#
# 下の /home/you と /path/to は置き場所に合わせて直す（exec は ~ を展開しない）。Windows なら command を python に、
# api-watch を C:/Users/you/AppData/Local/Programs/api-watch/api-watch.pyz にする。
params:
  - APIWATCH_EVENT_ID: ""
  - APIWATCH_DELIVERY_ID: ""
  - APIWATCH_SOURCE: ""
  - APIWATCH_RULE: ""
  - APIWATCH_RECORD_ID: ""
  - APIWATCH_KINDS: ""
  - APIWATCH_EVENT_FILE: ""
# 並列数は Dagu の設定（config.yaml の queues）で決める。同じレコードの変更は api-watch が
# 順番に渡す（order: completion なら前の実行が終わってから）ので、ここでは気にしなくてよい。
queue: api-watch-handlers
hist_retention_days: 30
steps:
  - name: handle
    action: exec
    with:
      command: python3
      args:
        - /path/to/your/handler.py
        - ${params.APIWATCH_EVENT_FILE}
    retry_policy:          # 後続処理の失敗は Dagu で再試行する
      limit: 3
      interval_sec: 60
      backoff: true
      max_interval_sec: 900
handler_on:
  # 後続処理の完了を記録する。これが無くても、dagu.mode: api なら reconcile で Dagu に問い合わせて記録できる
  success:
    action: exec
    with:
      command: python3
      args: [/home/you/.local/bin/api-watch, --config, /path/to/api-watch.yaml, ack, "${DAG_RUN_ID}"]
  failure:
    action: exec
    with:
      command: python3
      args: [/home/you/.local/bin/api-watch, --config, /path/to/api-watch.yaml, ack, "${DAG_RUN_ID}",
             --failed]
