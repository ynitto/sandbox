# ~/.config/dagu/dags/nightly-check-digest.yaml にコピーする。
# /home/you から始まるパスは、ツール・設定と hub agent を置いた場所に直す。
description: "夜間点検を集約し、GitLab のハブの issue にコメントする"
schedule: "30 7 * * *"
type: graph
hist_retention_days: 14
dotenv:
  - "/home/you/.config/change-watch/gitlab-issue-hub-agent/gitlab-issue-hub-agent.env"
steps:
  - name: compose
    action: exec
    with:
      command: "/home/you/.local/bin/change-watch"
      args:
        - "--plugin"
        - "gitlab_hub"
        - "note"
        - "--"
        - "python3"
        - "/home/you/work/repo/tools/nightly-check-digest/nightly_check_digest.py"
        - "--config"
        - "/home/you/.config/nightly-check-digest/config.json"
    timeout_sec: 60
    output: NOTE
  - name: comment
    depends: [compose]
    preconditions:              # 本文の JSON があるときだけ投稿する
      - condition: "${NOTE}"
        expected: 're:^\{"body"'
    action: exec
    with:
      command: "/home/you/.local/bin/change-watch"
      args:
        - "--plugin"
        - "gitlab_hub"
        - "--config"
        - "/home/you/.config/change-watch/gitlab-issue-hub-agent/change-watch.yaml"
        - "--connections"
        - "/home/you/.github/connections.yaml"
        - "call"
        - "POST"
        - "{{ env.GITLAB_HUB_ISSUE_URL | gitlab_issue_api }}/notes"
        - "--source"
        - "gitlab-hub-notes"
        - "--json"
        - "${NOTE}"
    timeout_sec: 120
    retry_policy:               # 一時的な失敗（終了コード 3）だけ再試行する
      limit: 3
      interval_sec: 60
      exit_code: [3]
