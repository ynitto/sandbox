# ~/.config/dagu/dags/doc-drift-nightly.yaml にコピーする。
# 作業コピーと状態ディレクトリのパス、点検範囲、CLI を運用環境に合わせる。
description: "ドキュメントの乖離を点検し、朝の集約用 JSON を書く"
schedule: "30 1 * * *"
type: graph
hist_retention_days: 14
steps:
  - name: detect
    working_dir: "/home/you/work/repo"
    action: exec
    with:
      command: "/bin/sh"
      args:
        - "-eu"
        - "-c"
        - |
          state_dir=/home/you/.local/state/nightly-check-digest
          mkdir -p "$state_dir"
          # 今回の点検が失敗したときに前回の結果が集約されないようにする。
          rm -f "$state_dir/doc-drift.json" .drift-work/drift-report.md
          prompt='.github/skills/doc-drift-detector/SKILL.md を読み、README.md と docs/ を対象に doc-drift-detector を実行してください。点検範囲は確定済みです。Step 6 の形式で .drift-work/drift-report.md に結果を書き、是正は行わないでください。'
          # 利用する CLI と、レポートの出力に必要な権限を環境に合わせる。
          # kiro-cli chat --no-interactive "$prompt" </dev/null
          # copilot -p "$prompt" </dev/null
          kiro-cli chat --no-interactive "$prompt" </dev/null
  - name: convert
    depends: [detect]
    working_dir: "/home/you/work/repo"
    action: exec
    with:
      command: "python3"
      args:
        - ".github/skills/doc-drift-detector/scripts/drift_report_to_json.py"
        - "--input"
        - ".drift-work/drift-report.md"
        - "--output"
        - "/home/you/.local/state/nightly-check-digest/doc-drift.json"
