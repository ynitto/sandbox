# 目標 1 つを裏で進める例（Windows）。目標ごとに 1 つ置き、名前と DOT のパスを変える。
# 起こす理由（始め・ハブの issue からの返事・決めた時刻）が無い回は tick が何も出さず、ask をスキップして act に進む。
#   tick     起こすかを決め、起こすなら依頼文を .goalie/prompt.md に書く
#   ask      Copilot のデスクトップアプリに依頼を渡し、終わるまで待つ（goalie job）
#   act      アプリが outbox に書いた提案を、policy.json の境界と照らして片付け、承認されたコマンドを動かす。ハブに送る文があれば、そのファイルのパスを出す
#   compose  送る文をコメントの JSON にする（gitlab-issue-hub-agent）
#   comment  ハブの issue にコメントする。GitLab がこの issue を見ている人へメールで知らせる
# Discovery の評価では、ask が受け箱に残す結果（終了コード）を act が評価 ID と対応づけて処理する。
# ask のスキップ・失敗後も act に進み、Discovery の採否を取り込む。
# act は毎回動かす。提案があれば片付け、依頼が終わったのに提案が無ければ出来事を inbox に戻して次の回にやり直す。
# アプリがまだ依頼に取りかかっている間（受け箱に残っている間）は、tick も act も何もしない。
# パスは自分の場所に直す。change-watch と gitlab_hub は gitlab-issue-hub-agent のインストーラが置いたもの（README の「用意」）。
description: "目標「見積り」を裏で進め、報告と質問をハブの issue に書く"
schedule: "*/15 * * * *"
type: graph
hist_retention_days: 14
dotenv:
  - "C:/Users/you/.config/change-watch/gitlab-issue-hub-agent/gitlab-issue-hub-agent.env"
env:
  - DOT: "C:/work/dots/estimate"      # 目標のフォルダ（Copilot アプリでプロジェクトとして開いておく）
steps:
  - name: tick
    action: exec
    with:
      command: python
      args:
        - "C:/tools/goalie/goalie.py"
        - "tick"
        - "--dir"
        - "${DOT}"
    timeout_sec: 60
    retry_policy:              # ほかの処理が state.json を使っていた（終了コード 3）ときだけやり直す
      limit: 5
      interval_sec: 20
      exit_code: [3]
    output: WAKE
  - name: ask
    depends: [tick]
    preconditions:              # 起こす理由があるときだけ
      - condition: "${WAKE}"
        expected: "re:^wake"
    continue_on:
      skipped: true             # 起こさなかった回も act に進む（前の回に遅れて終わった提案を片付ける）
      failure: true             # 拾われなかった・時間内に終わらなかったときも act に進む
    action: exec
    with:
      command: python
      args:
        - "C:/tools/goalie/goalie.py"
        - "job"
        - "run"
        - "--dir"
        - "${DOT}"
        - "--prompt-file"
        - "${DOT}/.goalie/prompt.md"
        - "--name"
        - "goalie"
        - "--timeout"
        - "5400"
    timeout_sec: 5700
  - name: act
    depends: [ask]
    action: exec
    with:
      command: python
      args:
        - "C:/tools/goalie/goalie.py"
        - "act"
        - "--dir"
        - "${DOT}"
    timeout_sec: 3600            # 承認されたコマンドもここで動く。policy.json の timeout より長くする
    retry_policy:              # ほかの処理が state.json を使っていた（終了コード 3）ときだけやり直す
      limit: 5
      interval_sec: 20
      exit_code: [3]
    output: COMMENT_FILE
  - name: compose
    depends: [act]
    preconditions:              # ハブに送る文があるときだけ
      - condition: "${COMMENT_FILE}"
        expected: "re:."
    action: exec
    with:
      command: python
      args:
        - "C:/Users/you/AppData/Local/Programs/change-watch/change-watch.pyz"
        - "--plugin"
        - "gitlab_hub"
        - "note"
        - "--text-file=${COMMENT_FILE}"
        - "--out"
        - "${DOT}/.goalie/hub-comment.json"
    timeout_sec: 60
    output: NOTE
  - name: comment
    depends: [compose]
    preconditions:
      - condition: "${NOTE}"
        expected: "re:."
    action: exec
    with:
      command: python
      args:
        - "C:/Users/you/AppData/Local/Programs/change-watch/change-watch.pyz"
        - "--plugin"
        - "gitlab_hub"
        - "--config"
        - "C:/Users/you/.config/change-watch/gitlab-issue-hub-agent/change-watch.yaml"
        - "--connections"
        - "C:/Users/you/.github/connections.yaml"
        - "call"
        - "POST"
        - "{{ env.GITLAB_HUB_ISSUE_URL | gitlab_issue_api }}/notes"
        - "--source"
        - "gitlab-hub-notes"
        - "--json-file"
        - "${DOT}/.goalie/hub-comment.json"
    timeout_sec: 120
    retry_policy:              # 一時的な失敗（終了コード 3）だけ再試行する
      limit: 3
      interval_sec: 60
      exit_code: [3]
