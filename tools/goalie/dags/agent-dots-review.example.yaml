# 業務の見直しを週 1 回行う例（Windows）。目標と goalie.py のパスを自分の場所に直す。
description: "目標「見積り」の業務の実行記録を見直す"
schedule: "0 9 * * 1"
type: graph
hist_retention_days: 14
env:
  - DOT: "C:/work/dots/estimate"
steps:
  - name: review
    action: exec
    with:
      command: python
      args:
        - "C:/tools/goalie/goalie.py"
        - "review"
        - "--dir"
        - "${DOT}"
    timeout_sec: 60
    retry_policy:              # ほかの処理が state.json を使っていた（終了コード 3）ときだけやり直す
      limit: 5
      interval_sec: 20
      exit_code: [3]
