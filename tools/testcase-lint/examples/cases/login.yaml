# ログインのケースの例（仕様 examples/spec/login.md と突き合わせる）
feature: ログイン
cases:
  - id: LG-01
    title: 登録済みの利用者がログインできる
    requirement: REQ-01
    preconditions: [利用者 user@example.com（パスワード Passw0rd）が登録されている, ログイン画面を開いている]
    steps:
      - メールアドレスに「user@example.com」を入力する
      - パスワードに「Passw0rd」を入力する
      - ログインボタンを押す
    expected:
      - ホーム画面に「ようこそ、user@example.com さん」と表示される

  - id: LG-02
    title: パスワードが違うとログインできない
    requirement: REQ-01
    preconditions: [利用者 user@example.com が登録されている, ログイン画面を開いている]
    steps:
      - メールアドレスに「user@example.com」を入力する
      - パスワードに「wrongpass」を入力する
      - ログインボタンを押す
    expected:
      - 「メールアドレスかパスワードが違いました」と表示される
      - ログイン画面のまま

  - id: LG-03
    title: パスワードが 7 文字だとエラー
    requirement: REQ-01
    preconditions: [ログイン画面を開いている]
    steps:
      - メールアドレスに「user@example.com」を入力する
      - パスワードに「abcdefg」を入力する
      - ログインボタンを押す
    expected:
      - 「パスワードは8文字以上20文字以下で入力してください」と表示される
