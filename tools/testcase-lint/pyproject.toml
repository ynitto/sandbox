[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "testcase-lint"
version = "0.1.0"
description = "自然文のテストケース（JSON / YAML）の重複・矛盾・漏れ・不備を LLM なしで指摘する"
requires-python = ">=3.9"
dependencies = ["PyYAML>=5.4", "Janome>=0.4"]

[project.scripts]
testcase-lint = "testcase_lint.cli:main"

[tool.setuptools]
packages = ["testcase_lint"]
