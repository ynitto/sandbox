# codd-review — 確かめる。codd-agent の本流（変える）とは別で、コードも文書も直さない
#
#   start ─┬─ 項目あり → items ─[check]→ free ─[check]→ ahead ─[check]→ report
#          └─ 項目なし → report
#
# 会話では `codd.py step --review` がこの定義を読んで回す。各ステートの仕事は codd-agent の設計書（§5.10）にある。

name: "codd-review"
description: "グラフを用意し、実装・文書・テストの漏れ・矛盾・設計の不備を確かめ、次の計画を立てておく（直さない）"
initial_state: start

inputs:
  target:
    label: 何を確かめるか
    type: multiline
    default: ""
    description: "ファイル・フォルダ・機能の名前・期間（空なら直近 7 日に変わったファイル。無ければさらに遡る）"

config:
  max_steps: 14
  on_no_transition: error

states:
  start:
    description: "グラフを用意し、点検して、見る項目を決める"
    action_file: actions/start.md
    output_key: found
    output_validator: "startswith:OK,NONE"
    max_retries: 1

  items:
    description: "項目に 1 件ずつ答える"
    action_file: actions/items.md
    output_validator: "startswith:OK"
    check: {command: python3, args: [.statemachine/codd/codd.py, review, verify, --part, items], timeout_sec: 120}
    check_retries: 2
    check_on_exhausted: continue

  free:
    description: "項目で拾えなかったものを自由に書く"
    action_file: actions/free.md
    output_validator: "startswith:OK"
    check: {command: python3, args: [.statemachine/codd/codd.py, review, verify], timeout_sec: 120}
    check_retries: 2
    check_on_exhausted: continue

  ahead:
    description: "見つけたやりたいことから、次の計画を立てておく"
    action_file: actions/ahead.md
    output_validator: "startswith:OK"
    check: {command: python3, args: [.statemachine/codd/codd.py, next, --verify], timeout_sec: 120}
    check_retries: 2
    check_on_exhausted: continue

  report:
    description: "見つけたものと、本流に渡すやりたいことを伝える"
    action_file: actions/report.md
    terminal: true

transitions:
  - {from: start, to: items, condition_rule: "startswith:found:OK", priority: 1}
  - {from: start, to: report, condition_rule: "startswith:found:NONE", priority: 2}
  - {from: items, to: free, condition_rule: "equals:check_ok:true", priority: 1}
  - {from: items, to: report, condition_rule: "equals:check_ok:false", priority: 2}
  - {from: free, to: ahead}
  - {from: ahead, to: report}
