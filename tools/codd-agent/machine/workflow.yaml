# codd-agent — 参照先（実装⇔設計書）を読んで、自分の変更を練り、確認してから両方を変える
#
#   plan ─[verify-plan]→ confirm ─ OK → apply ─[verify-apply]→ done → retro（MORE なら apply_more で次の段）
#   NG → plan、STOP → stopped → retro、検査が通らなければ stuck（PLAN / APPLY / STOP）
#
# 会話では `codd.py step` がこの定義を読んで回す（agent-herd のハーネスはこの定義をそのまま使う）。
# 各ステートの仕事と理由は codd-agent の設計書（docs/designs/codd-agent-design.md の §2）にある。

name: "codd"
description: "参照先のリポジトリ（実装⇔設計書）を読んで自分の変更を練り、利用者の確認を経て、必要なら参照先も変える"
initial_state: plan

inputs:
  request:
    label: やりたいこと
    type: multiline

context:
  answer: ""        # confirm の答え。NG なら指摘ごと plan に渡る（初回は空）。STOP ならやめる
  choice: ""        # stuck の答え。利用者が選んだ次の手と指示が plan / apply に渡る（止まっていなければ空）

config:
  max_steps: 60     # 段に分けた apply のぶん、余裕を持たせる
  on_no_transition: error

states:
  plan:
    description: "参照先を読み、変更を練る"
    action_file: actions/plan.md
    output_validator: "startswith:OK,FAILED"
    # 時間を明示する（既定の 120 秒では、グラフの作り直しで切られて「落ちた」扱いになる）
    check: {command: python3, args: [.statemachine/codd/codd.py, verify-plan], timeout_sec: 1800}
    check_retries: 2
    check_on_exhausted: continue   # 使い切ったら stuck で利用者に次の手を訊く（訊かずに戻すのはここの 2 回だけ）

  confirm:
    description: "計画を利用者に確認する"
    action_file: actions/confirm.md
    output_key: answer
    output_validator: "startswith:OK,NG,STOP"
    max_retries: 1

  apply:
    description: "計画どおりに変える"
    action_file: actions/apply.md
    output_validator: "startswith:OK,FAILED"
    # テストと変えたあとの検査（設定の test・check）を動かすので長めに取る
    check: {command: python3, args: [.statemachine/codd/codd.py, verify-apply], timeout_sec: 3600}
    check_retries: 0               # すぐ stuck へ。人の判断が要らない理由だけなら stuck が訊かずに戻す（advise の AUTO）。
                                   # ここで再投入すると、人の判断が要る失敗でもテストからやり直して 1 回ぶん無駄にする
    check_on_exhausted: continue

  apply_more:
    description: "次の段を変える（2 段目から）"
    action_file: actions/apply-more.md
    output_validator: "startswith:OK,FAILED"
    check: {command: python3, args: [.statemachine/codd/codd.py, verify-apply], timeout_sec: 3600}
    check_retries: 0
    check_on_exhausted: continue

  stuck:
    description: "止まった理由と次の手を示し、利用者に選んでもらう"
    action_file: actions/stuck.md
    output_key: choice
    output_validator: "startswith:PLAN,APPLY,STOP"
    max_retries: 1

  done:
    description: "変えた結果を伝える"
    action_file: actions/done.md

  stopped:
    description: "やめたときの結果を伝える"
    action_file: actions/stopped.md

  retro:
    description: "振り返る（問題があれば課題メモを残し、設定のプロンプトがあれば実行する。訊かない）"
    action_file: actions/retro.md
    output_validator: "startswith:OK,FAILED"
    terminal: true

transitions:
  - {from: plan, to: confirm, condition_rule: "equals:check_ok:true", priority: 1}
  - {from: confirm, to: apply, condition_rule: "startswith:answer:OK", priority: 1}
  - {from: confirm, to: plan, condition_rule: "startswith:answer:NG", priority: 2}
  - {from: confirm, to: stopped, condition_rule: "startswith:answer:STOP", priority: 3}
  - {from: plan, to: stuck, condition_rule: "equals:check_ok:false", priority: 2}
  - {from: apply, to: apply_more, condition_rule: "equals:check_ok:true;startswith:check_output:MORE", priority: 1}
  - {from: apply_more, to: apply_more, condition_rule: "equals:check_ok:true;startswith:check_output:MORE", priority: 1}
  - {from: apply_more, to: done, condition_rule: "equals:check_ok:true", priority: 2}
  - {from: apply_more, to: stuck, condition_rule: "equals:check_ok:false", priority: 3}
  - {from: apply, to: done, condition_rule: "equals:check_ok:true", priority: 2}
  - {from: apply, to: stuck, condition_rule: "equals:check_ok:false", priority: 3}
  - {from: stuck, to: plan, condition_rule: "startswith:choice:PLAN", priority: 1}
  - {from: stuck, to: apply, condition_rule: "startswith:choice:APPLY", priority: 2}
  - {from: stuck, to: stopped, condition_rule: "startswith:choice:STOP", priority: 3}
  - {from: done, to: retro}
  - {from: stopped, to: retro}
