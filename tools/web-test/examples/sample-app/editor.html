<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>メモの編集</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #1f2328; }
  header { background: #24292f; color: #fff; padding: 12px 24px; display: flex; gap: 12px; align-items: center; }
  header .spacer { flex: 1; }
  main { max-width: 560px; margin: 32px auto; background: #fff; border: 1px solid #dfe3e8; border-radius: 8px; padding: 24px; }
  label { display: block; margin: 12px 0 4px; }
  input[type=text] { width: 100%; box-sizing: border-box; padding: 8px; }
  button { padding: 6px 14px; }
  #mobile-menu { position: absolute; right: 16px; top: 52px; background: #fff; border: 1px solid #dfe3e8; padding: 8px; }
  /* 画面幅で「保存」の置き場が変わる。広い画面はツールバー、狭い画面はメニューの中。どちらも DOM には常にある */
  .menu-toggle { display: none; }
  @media (max-width: 700px) {
    .toolbar { display: none; }
    .menu-toggle { display: inline-block; }
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <span id="brand">メモ帳</span><span class="spacer"></span>
  <nav class="toolbar"><button type="button" class="save">保存</button></nav>
  <button type="button" class="menu-toggle" aria-expanded="false" aria-controls="mobile-menu">メニュー</button>
</header>
<div id="mobile-menu" hidden><button type="button" class="save">保存</button></div>
<main>
  <h1 id="heading">メモの編集</h1>
  <div id="editor"></div>
  <p id="status" role="status"></p>
</main>
<script>
  // 確認用の画面。web-test の「操作の前に確かめる」の試験に使う。
  //  - 「保存」はツールバーとメニューに 2 つある（片方は常に隠れている）
  //  - 「公開」は「内容を確認しました」に印を付けるまで押せない
  //  - localStorage の lang=en で英語になる
  //  - 保存すると、少し遅れて編集欄を作り直す（前に確かめた要素は別物になる）。遅れは ?rerender=<ミリ秒>
  const T = {
    ja: { title: 'メモの編集', brand: 'メモ帳', save: '保存', menu: 'メニュー', field: 'タイトル', agree: '内容を確認しました', publish: '公開', saved: '保存しました', published: '公開しました' },
    en: { title: 'Edit note', brand: 'Notes', save: 'Save', menu: 'Menu', field: 'Title', agree: 'I have reviewed the content', publish: 'Publish', saved: 'Saved', published: 'Published' },
  };
  const t = T[localStorage.getItem('lang') === 'en' ? 'en' : 'ja'];
  document.documentElement.lang = t === T.en ? 'en' : 'ja';
  document.title = t.title;
  document.getElementById('heading').textContent = t.title;
  document.getElementById('brand').textContent = t.brand;
  document.querySelectorAll('.save').forEach((b) => { b.textContent = t.save; });
  const toggle = document.querySelector('.menu-toggle');
  const menu = document.getElementById('mobile-menu');
  toggle.textContent = t.menu;
  toggle.addEventListener('click', () => {
    menu.hidden = !menu.hidden;
    toggle.setAttribute('aria-expanded', String(!menu.hidden));
  });
  let title = '';
  function render() {
    const ed = document.getElementById('editor');
    ed.innerHTML = `
      <label for="title">${t.field}</label>
      <input id="title" type="text">
      <label><input type="checkbox" id="agree"> ${t.agree}</label>
      <p><button type="button" id="publish" disabled>${t.publish}</button></p>`;
    const input = document.getElementById('title');
    input.value = title;
    input.addEventListener('input', () => { title = input.value; });
    const agree = document.getElementById('agree');
    const publish = document.getElementById('publish');
    agree.addEventListener('change', () => { publish.disabled = !agree.checked; });
    publish.addEventListener('click', () => { document.getElementById('status').textContent = t.published; });
  }
  render();
  document.querySelectorAll('.save').forEach((b) => b.addEventListener('click', () => {
    document.getElementById('status').textContent = t.saved;
    menu.hidden = true;
    toggle.setAttribute('aria-expanded', 'false');
    setTimeout(render, Number(new URLSearchParams(location.search).get('rerender')) || 150);
  }));
</script>
</body>
</html>
