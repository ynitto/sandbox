# 再送のワークフロー: evaluate → dispatch → reconcile。workflow の受け渡し先（Dagu の DAG へ渡す）があるときだけ置く。
# command は install.py install が置いた change-watch（exec は ~ を展開しないので絶対パスで書く）。Windows なら command を python に、
# args の先頭を C:/Users/you/AppData/Local/Programs/change-watch/change-watch.pyz にする。
# 設定は既定の ~/.config/change-watch/change-watch.yaml を読む。別の場所なら args の先頭に "--config" と <パス> を足す。
# "--plugin" "dagu" は Dagu へ渡す dispatch と、Dagu に状態を問い合わせる reconcile だけに付ける。
# ほかのプラグイン（"--plugin" と <.py のパス>）を足すなら、どのステップにも同じように足す。
description: "未判定の取得結果の判定と、渡せていない変更の再送・後続処理の完了の確認"
schedule: "* * * * *"
type: graph
hist_retention_days: 14
steps:
  - name: evaluate
    action: exec
    with:
      command: "/home/you/.local/bin/change-watch"
      args:
        - "--connections"
        - "/home/you/.github/connections.yaml"
        - "evaluate"
    timeout_sec: 600
  - name: dispatch
    depends: [evaluate]
    action: exec
    with:
      command: "/home/you/.local/bin/change-watch"
      args:
        - "--plugin"
        - "dagu"
        - "--connections"
        - "/home/you/.github/connections.yaml"
        - "dispatch"
    timeout_sec: 600
  - name: reconcile
    depends: [dispatch]
    action: exec
    with:
      command: "/home/you/.local/bin/change-watch"
      args:
        - "--plugin"
        - "dagu"
        - "--connections"
        - "/home/you/.github/connections.yaml"
        - "reconcile"
    timeout_sec: 300
