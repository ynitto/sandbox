# 取得元ごとのワークフロー: fetch → evaluate → dispatch。workflow の受け渡し先（Dagu の DAG へ渡す）を持つルールに使う。
# change-watch-<取得元>.yaml として置き、items を取得元の名前に書き換える。
# schedule は Dagu の起動の間隔。API へいつ問い合わせるかは change-watch の設定（取得元の schedule・min_interval_sec）が決めるので、
# 取得元にどちらも無いなら、ここを問い合わせてよい間隔にする（フォルダの取得元は毎分でよい）。
# command は install.py install が置いた change-watch（exec は ~ を展開しないので絶対パスで書く）。Windows なら command を python に、
# args の先頭を C:/Users/you/AppData/Local/Programs/change-watch/change-watch.pyz にする。
# 設定は既定の ~/.config/change-watch/change-watch.yaml を読む。別の場所なら args の先頭に "--config" と <パス> を足す。
# プラグインを足すなら "--plugin" と <.py のパス> を、どのステップにも同じように足す。
description: "items を取得し、ルールで判定して、受け渡し先のワークフローへ渡す"
schedule: "* * * * *"
type: graph
hist_retention_days: 14
steps:
  - name: fetch
    action: exec
    with:
      command: "/home/you/.local/bin/change-watch"
      args:
        - "--plugin"
        - "dagu"
        - "--connections"
        - "/home/you/.github/connections.yaml"
        - "fetch"
        - "--source"
        - "items"
    timeout_sec: 720             # 要求の上限 × 再試行 + Retry-After の待ち。取得元の jitter_sec・busy_wait_sec を書いたらその分を足す
    retry_policy:              # 一時的な失敗（終了コード 3）だけ再試行する
      limit: 3
      interval_sec: 60
      backoff: true
      max_interval_sec: 600
      exit_code: [3]
  - name: evaluate
    depends: [fetch]
    action: exec
    with:
      command: "/home/you/.local/bin/change-watch"
      args:
        - "--plugin"
        - "dagu"
        - "--connections"
        - "/home/you/.github/connections.yaml"
        - "evaluate"
        - "--source"
        - "items"
    timeout_sec: 600
    retry_policy:
      limit: 2
      interval_sec: 10
  - name: dispatch
    depends: [evaluate]
    action: exec
    with:
      command: "/home/you/.local/bin/change-watch"
      args:
        - "--plugin"
        - "dagu"
        - "--connections"
        - "/home/you/.github/connections.yaml"
        - "dispatch"
        - "--source"
        - "items"
    timeout_sec: 600
