# external の受け渡し先のワークフロー: fetch → evaluate → claim → render → handle → finish。
# change-watch は実行せず、このワークフローの handle が処理する（1 回の起動で 1 件。1 つのルールに external は 1 つまで）。
# change-watch-<ルール>.yaml として置き、items を取得元、review をルール、agent を受け渡し先の名前に書き換え、handle を処理に置き換える。
# 受け渡し先に input_template が無ければ render を消し、handle の depends を [claim] にする。
# handle の timeout_sec は受け渡し先の timeout_sec（既定 3600）より長くしない。finish は handle の終了コードで、
# 0 なら処理し終えた状態を記録し、それ以外ならあとでやり直す。
# command は install.py install が置いた change-watch（exec は ~ を展開しないので絶対パスで書く）。Windows なら command を python に、
# args の先頭を C:/Users/you/AppData/Local/Programs/change-watch/change-watch.pyz にする。
# 設定は既定の ~/.config/change-watch/change-watch.yaml を読む。別の場所なら args の先頭に "--config" と <パス> を足す。
# プラグインを足すなら "--plugin" と <.py のパス> を、どのステップにも同じように足す。
description: "items を取得し、ルール review で判定して、1 回の起動で 1 件を処理する"
schedule: "* * * * *"
type: graph
hist_retention_days: 14
steps:
  - name: fetch
    action: exec
    with:
      command: "/home/you/.local/bin/change-watch"
      args:
        - "--plugin"
        - "dagu"
        - "--connections"
        - "/home/you/.github/connections.yaml"
        - "fetch"
        - "--source"
        - "items"
    timeout_sec: 720             # 要求の上限 × 再試行 + Retry-After の待ち。取得元の jitter_sec・busy_wait_sec を書いたらその分を足す
    retry_policy:              # 一時的な失敗（終了コード 3）だけ再試行する
      limit: 3
      interval_sec: 60
      backoff: true
      max_interval_sec: 600
      exit_code: [3]
  - name: evaluate
    depends: [fetch]
    action: exec
    with:
      command: "/home/you/.local/bin/change-watch"
      args:
        - "--plugin"
        - "dagu"
        - "--connections"
        - "/home/you/.github/connections.yaml"
        - "evaluate"
        - "--rule"
        - "review"
    timeout_sec: 600
    retry_policy:
      limit: 2
      interval_sec: 10
  - name: claim
    depends: [evaluate]
    action: exec
    with:
      command: "/home/you/.local/bin/change-watch"
      args:
        - "--plugin"
        - "dagu"
        - "--connections"
        - "/home/you/.github/connections.yaml"
        - "claim"
        - "--rule"
        - "review"
        - "--target"
        - "agent"
    timeout_sec: 600
    output: DELIVERY
  - name: render
    depends: [claim]
    action: exec
    with:
      command: "/home/you/.local/bin/change-watch"
      args:
        - "--plugin"
        - "dagu"
        - "--connections"
        - "/home/you/.github/connections.yaml"
        - "render"
        - "${DELIVERY}"
    timeout_sec: 300
    preconditions:              # 取れた受け渡しがあるときだけ（ID は aw_ で始まる）
      - condition: "${DELIVERY}"
        expected: "re:^aw_"
    output: INPUT
  - name: handle
    id: handle
    depends: [render]
    preconditions:              # 取れた受け渡しがあるときだけ（ID は aw_ で始まる）
      - condition: "${DELIVERY}"
        expected: "re:^aw_"
    timeout_sec: 3600
    continue_on:                # 失敗・時間切れでも finish で記録する
      failure: true
    # ここを処理に置き換える。render が組んだ文章は ${INPUT}。例: Dagu v2 の harness.run でエージェント CLI を動かす
    action: harness.run
    working_dir: /home/you/work/project
    with:
      provider: claude
      prompt: 標準入力の指示に従って対応してください。
      stdin: "${INPUT}"
      dangerously_skip_permissions: true     # 無人で動かすため
  - name: finish
    depends: [handle]
    action: exec
    with:
      command: "/home/you/.local/bin/change-watch"
      args:
        - "--plugin"
        - "dagu"
        - "--connections"
        - "/home/you/.github/connections.yaml"
        - "finish"
        - "${DELIVERY}"
        - "--exit-code"
        - "${handle.exit_code}"
    timeout_sec: 600
    preconditions:              # 取れた受け渡しがあるときだけ（ID は aw_ で始まる）
      - condition: "${DELIVERY}"
        expected: "re:^aw_"
