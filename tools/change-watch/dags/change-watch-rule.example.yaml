# ルールごとのワークフロー: fetch → evaluate → work。command の受け渡し先を持つルールに使う（change-watch が 1 件ずつ実行する）。
# change-watch-<ルール>.yaml として置き、items を取得元、triage をルールの名前に書き換える。
# ルールに workflow の受け渡し先もあるなら、evaluate と work の間に dispatch（args は "dispatch" "--rule" <ルール>）を挟み、
# 下の change-watch-dispatch も置く。
# command は install.py install が置いた change-watch（exec は ~ を展開しないので絶対パスで書く）。Windows なら command を python に、
# args の先頭を C:/Users/you/AppData/Local/Programs/change-watch/change-watch.pyz にする。
# 設定は既定の ~/.config/change-watch/change-watch.yaml を読む。別の場所なら args の先頭に "--config" と <パス> を足す。
# どのステップも Dagu に触らないので "--plugin" "dagu" は要らない（dispatch を挟むなら、そのステップにだけ付ける）。
# ほかのプラグイン（"--plugin" と <.py のパス>）を足すなら、どのステップにも同じように足す。
description: "items を取得し、ルール triage で判定して、その場で実行する"
schedule: "* * * * *"
type: graph
hist_retention_days: 14
steps:
  - name: fetch
    action: exec
    with:
      command: "/home/you/.local/bin/change-watch"
      args:
        - "--connections"
        - "/home/you/.github/connections.yaml"
        - "fetch"
        - "--source"
        - "items"
    timeout_sec: 720             # 要求の上限 × 再試行 + Retry-After の待ち。取得元の jitter_sec・busy_wait_sec を書いたらその分を足す
    retry_policy:              # 一時的な失敗（終了コード 3）だけ再試行する
      limit: 3
      interval_sec: 60
      backoff: true
      max_interval_sec: 600
      exit_code: [3]
  - name: evaluate
    depends: [fetch]
    action: exec
    with:
      command: "/home/you/.local/bin/change-watch"
      args:
        - "--connections"
        - "/home/you/.github/connections.yaml"
        - "evaluate"
        - "--rule"
        - "triage"
    timeout_sec: 600
    retry_policy:
      limit: 2
      interval_sec: 10
  - name: work
    depends: [evaluate]
    action: exec
    with:
      command: "/home/you/.local/bin/change-watch"
      args:
        - "--connections"
        - "/home/you/.github/connections.yaml"
        - "work"
        - "--rule"
        - "triage"
    # 1 件ごとの上限は受け渡し先の timeout_sec が持つので、ステップには上限を付けない
