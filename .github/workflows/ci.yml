name: CI

# このリポジトリ初の CI（修正計画 P3-1 / 実装計画 R4）。回すのは 3 系統:
#
#   1. python  … 各パッケージの単体テスト（agent-project / agent-flow / agent-amigos /
#                agent-audit / agentcore / winauto / gitlab-repo-sync / agent-loop）。
#                **agentcore はテストルートが 2 つある**ので両方を明示する
#                （片方だけ discover すると残りが黙ってスキップされる）。
#                設定キーの構造テスト（CONFIG_DEFAULTS → Config の到達性）は
#                agent-project のスイートに含まれる。
#   2. dashboard … agent-dashboard の `npm test`（node のみで走る・依存の導入は不要）。
#      agent-app … 同じく `npm test`（会話・タスク・ワークフローの Electron アプリ。旧 statemachine-maker
#      を統合済み）。生成した定義を statemachine-use スキルの run_machine.py --dry-run に通す
#      結合テストを含むので python も要る。実機の起動（electron）は CI では skip される。
#      testcase-lint … `npm test`（自然文のテストケースの点検。LLM は呼ばない。形態素解析の辞書は依存に同梱）。
#      office-preview … `npm test`（docx / xlsx / pptx のプレビュー画像。変換は node だけで確かめ、
#      Electron で実際に描くテストは CI では skip される）。
#   3. docs    … 利用者向け文書の内部名検査（R10）、スキルの references/ 健全性検査
#                （切れリンク・孤児・未許可の2ホップ参照）、スキル自身の品質検査
#                （skill-evaluator 同梱の quality_check.py。frontmatter の未知キーなど
#                エラーだけで落ち、description の字数超過は警告なので落ちない）、
#                それぞれの検査自身の単体テスト。
#      figma-use … スキル同梱の CLI の `node --test`（依存なし。Figma の実 API は呼ばない）。
#   4. vscode-copilot … このスイートだけ pytest 形式（tmp_path などを使う）なので
#                独立したジョブにする。**上の python matrix へ足してはいけない**——
#                あちらは `unittest discover` で、pytest 形式のテストは 1 件も収集
#                されないまま緑になる（無いより悪い）。拡張は JS なので構文検査と、
#                `vscode` を差し替えた node:test（ループ・bridge ツール）を添える。
#                本物の VS Code 越しの挙動は手検証で押さえている。
#
# 各ジョブは独立に落ちてよい（fail-fast: false）——1 パッケージの失敗で他の結果が
# 見えなくなると、直す順番を決める材料が減る。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: python (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: agent-project
            suites: tools/agent-project/tests
          - package: agent-flow
            suites: tools/agent-flow/tests
          - package: agent-amigos
            suites: tools/agent-amigos/tests
          - package: agent-audit
            suites: tools/agent-audit/tests
          # テストルートが 2 つ（agentcore/tests と agentcore/agentcore/tests）。
          - package: agentcore
            suites: >-
              tools/agent-tools/agentcore/tests
              tools/agent-tools/agentcore/agentcore/tests
          # laya の導入スクリプトと CPU サーバ（実物の laya・PyTorch は入れず、偽の Router で押さえる）。
          - package: laya
            suites: tools/laya
          # winauto は Windows 専用ツールだが、ロック・doctor・WSL ラッパーの
          # 引数変換は Windows 非依存なので Linux ランナーで回せる。
          - package: winauto
            suites: tools/winauto/tests
          # gitlab-repo-sync は git さえあれば完結する（bare repo を「両側の GitLab」に
          # 見立てた end-to-end テストを含む。ネットワークには出ない）。
          - package: gitlab-repo-sync
            suites: tools/gitlab-repo-sync/tests
          # codd-agent。実装・設計書の 2 リポジトリを一時フォルダに作って下請けスクリプトを通す（LLM・graphify は呼ばない）。
          # 定義の検証に statemachine-use の run_machine.py（PyYAML）を使う。
          - package: codd-agent
            suites: tools/codd-agent/tests
          # agent-loop。tmux も kiro-cli も差し替えたうえで、設定解釈と送信順だけを見る
          # （実プロセスは起こさない）。
          - package: agent-loop
            suites: tools/agent-loop/test
          # gitlab-issue-agent。GitLab は手元の HTTP サーバで偽装し、設定とワークフローの例を本物の change-watch で
          # get → 条件 → commit の順に回したときの「変わった issue を 1 回だけ流す」と、gitlab-idd の設定の例を見る。
          - package: gitlab-issue-agent
            suites: tools/change-watch/agents/gitlab-issue-agent/test
          # gitlab-issue-hub-agent。GitLab は手元の HTTP サーバで偽装し、gitlab_hub.py の note・reply と、設定とワークフローの例を
          # 本物の change-watch で get → request → reply → commit の順に回したときの「【依頼】にだけ 1 回返信する」「通知を書く」を見る。
          - package: gitlab-issue-hub-agent
            suites: tools/change-watch/agents/gitlab-issue-hub-agent/test
          # gitlab-mr-review-agent。GitLab は手元の HTTP サーバで偽装し、gitlab_mr.py のコマンド（指摘・解決・まとめの重複防止）と、
          # 設定の例を本物の change-watch でワークフローの順に回したときの「同じコミットを二度レビューしない」「直った指摘を閉じる」を見る。
          - package: gitlab-mr-review-agent
            suites: tools/change-watch/agents/gitlab-mr-review-agent/test
          # gitlab-idd スキルの作業用フォルダ（gl.py workspace-create / workspace-remove）。手元の bare リポジトリで、
          # 既にある作業コピーへの git worktree・一時フォルダへのクローン・片付けを見る（GitLab の API は呼ばない）。
          - package: gitlab-idd
            suites: .github/skills/gitlab-idd/tests
          # redmine-ticket-agent。Redmine は手元の HTTP サーバで偽装し、設定とワークフローの例を本物の change-watch で
          # get → 条件 → call → commit の順に回したときの対象の絞り込みと 1 回だけの完了を見る。
          - package: redmine-ticket-agent
            suites: tools/change-watch/agents/redmine-ticket-agent/test
          # change-watch。API は手元の HTTP サーバで偽装し、取得の集約・ページング・増分・再開・get / commit の変化・
          # 保持期間と、dags/ の例を Dagu と同じ順で流したときの動きを見る（Dagu 本体は入れない）。
          - package: change-watch
            suites: tools/change-watch/test
          # dagu-workflow-builder スキル。スキル置き場は一時フォルダに作り、生成した DAG は Dagu の代わりに
          # Python で順に流す（Dagu 本体は入れない）。同梱の chain.json の検査もここで回す。
          - package: dagu-workflow-builder
            suites: .github/skills/dagu-workflow-builder/tests
          # 評価ハーネス（worker_eval の手順制御・engine の解決）。LLM もエージェント
          # CLI も呼ばない部分だけを見る。**測定の道具が壊れていると、壊れたことが
          # モデルの数字として台帳へ残る**ので、ここも CI で押さえる。readout_eval の
          # 区間分けと集計も同じ理由でここに入る（ollama を呼ぶ部分は CI では走らない）。
          - package: eval
            suites: tools/agent-tools/eval
    env:
      # エージェント CLI のスタブが実時間 sleep しないようにする（README のテスト手順と同じ）。
      AGENT_FLOW_STUB_SLEEP_MAX: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: 依存（yaml 設定の読み書きに要る）
        run: python -m pip install --upgrade pip pyyaml
      # eval の決定的チェッカー（T4 の probe・T5/T6 の pytest）はハーネス自身が回す。
      # 実機ではリポジトリの .venv を使うが、CI のクリーンな木には .venv が無いので
      # 走っているインタプリタ側へ pytest を入れる（worker_eval.CHECK_PY が倒れる先）。
      - name: 依存（eval の決定的チェッカーが回す pytest）
        if: matrix.package == 'eval'
        run: python -m pip install pytest
      # codd-agent の結合テストは、ケースの点検とテストの実行に testcase-lint（Node）を使う。
      - name: 依存（codd-agent の結合テストが呼ぶ testcase-lint）
        if: matrix.package == 'codd-agent'
        working-directory: tools/testcase-lint
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: git の実行者情報（テストが作るリポジトリのコミットに要る）
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"
      - name: unittest
        run: |
          for suite in ${{ matrix.suites }}; do
            echo "::group::$suite"
            python -m unittest discover -s "$suite"
            echo "::endgroup::"
          done

  # gitlab-issue-agent は Windows でもそのまま動かす（change-watch をワークフローの順で呼ぶ流れ）。
  # Windows の実機で確かめる。
  gitlab-issue-agent-windows:
    name: python (gitlab-issue-agent, windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: unittest
        run: python -m unittest discover -s tools/change-watch/agents/gitlab-issue-agent/test

  # change-watch のほかのエージェント（ハブ・MR のレビュー・Redmine）と、gitlab-idd の作業用フォルダも Windows でそのまま動かす
  # （git のパス・改行・一時フォルダ・読み取り専用のファイルの削除）。
  agent-plugins-windows:
    name: python (${{ matrix.package }}, windows)
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: gitlab-issue-hub-agent
            suites: tools/change-watch/agents/gitlab-issue-hub-agent/test
          - package: gitlab-mr-review-agent
            suites: tools/change-watch/agents/gitlab-mr-review-agent/test
          - package: redmine-ticket-agent
            suites: tools/change-watch/agents/redmine-ticket-agent/test
          - package: gitlab-idd
            suites: .github/skills/gitlab-idd/tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: 依存（YAML の設定の読み込み）
        run: python -m pip install pyyaml
      - name: unittest
        run: python -m unittest discover -s ${{ matrix.suites }}

  # change-watch も Windows でそのまま動かす（SQLite のロック・プロセスの生存確認・強制終了からの引き継ぎ）。
  change-watch-windows:
    name: python (change-watch, windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: 依存（YAML の設定の読み込み）
        run: python -m pip install pyyaml
      - name: unittest
        run: python -m unittest discover -s tools/change-watch/test

  dashboard:
    name: dashboard (npm test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      # 実行時依存（`yaml` / `diff2html`）は src から require されるのでテストにも要る。
      # **開発依存は入れない**（electron はバイナリ取得で分単位かかり、テストは起動しない）。
      # `package-lock.json` はこのリポジトリでは .gitignore 対象なので `npm ci` は使えない。
      # postinstall も走らせない（依存の追加スクリプトを CI で実行しない）。
      - name: 実行時依存の導入
        working-directory: tools/agent-dashboard
        run: npm install --omit=dev --no-audit --no-fund --ignore-scripts
      - name: npm test
        working-directory: tools/agent-dashboard
        run: npm test

  webui-test:
    name: webui-test (npm test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: 依存の導入
        working-directory: tools/webui-test
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Chromium の導入（テストは実際にブラウザで画面を開く）
        working-directory: tools/webui-test
        run: npx playwright install --with-deps chromium
      - name: npm test
        working-directory: tools/webui-test
        run: npm test

  testcase-lint:
    name: testcase-lint (npm test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: 依存の導入
        working-directory: tools/testcase-lint
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: npm test
        working-directory: tools/testcase-lint
        run: npm test

  agent-app:
    name: agent-app (npm test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # 結合テストは statemachine-use スキルの本物のスクリプト（run_machine.py --dry-run）で
      # 生成した定義を検証する。スクリプトは PyYAML だけを要る。
      - name: PyYAML（スキルのスクリプト用）
        run: python -m pip install --upgrade pip pyyaml
      # 画面用ライブラリ（xterm / marked …）は devDependencies で、テストは vendor/ への写しがあることも
      # 見る。postinstall は走らせず（electron のバイナリ取得も含めて CI では実行しない）、写しだけ
      # 明示的に作る。electron のバイナリが無いので実機の起動テストは skip される。
      # `package-lock.json` はこのリポジトリでは .gitignore 対象なので `npm ci` は使えない。
      - name: 依存の導入（バイナリ取得と postinstall は走らせない）
        working-directory: tools/agent-app
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: 画面用ライブラリを vendor/ へ写す
        working-directory: tools/agent-app
        run: npm run vendor
      - name: git の実行者情報（テストが作るリポジトリのコミットに要る）
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"
      - name: npm test
        working-directory: tools/agent-app
        run: npm test

  office-preview:
    name: office-preview (npm test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      # 実行時の依存は無い。electron（開発依存）はバイナリを取らずに入れるので、実際に描くテストは skip される。
      - name: 依存の導入（バイナリ取得は走らせない）
        working-directory: tools/office-preview
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: npm test
        working-directory: tools/office-preview
        run: npm test

  # figma-use スキルの CLI（Node 24 の標準モジュールだけで動く）。Figma の実 API は呼ばず、
  # テストが立てる模造の API に対して URL 解析・正規化・再試行・キャッシュ・部分失敗を確かめる。
  figma-use:
    name: figma-use (node --test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: node --test
        working-directory: .github/skills/figma-use
        run: node --test tests/*.test.mjs

  vscode-copilot:
    name: python (vscode-copilot)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: 依存（このスイートは pytest 形式）
        run: python -m pip install --upgrade pip pytest
      - name: pytest
        run: python -m pytest tools/vscode-copilot/tests -q
      - name: 拡張の構文検査
        run: node --check tools/vscode-copilot/extension/extension.js
      # 本物の VS Code は起こせないので、`vscode` を差し替えてループと bridge ツールを回す。
      - name: 拡張のテスト（node:test、依存なし）
        run: node --test tools/vscode-copilot/extension/test/extension.test.js

  docs:
    name: docs (R10 / スキル参照・品質検査)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: 利用者向け文書に内部名が出ていないこと
        run: python tools/ci/check_user_docs.py
      # Windows（cmd.exe / wslpath / PowerShell）と喋るファイルだけを見る。CI は ubuntu だけで
      # 回すので、WSL の Python が CP932 の出力を読み損ねる壊れ方は実行では捕まらない。
      # 新しく text=True のまま書いた呼び出しを止め、decode_cli_output へ寄せる。
      - name: Windows と喋る subprocess が出力の文字コードを決め打ちしていないこと
        run: python tools/ci/check_subprocess_encoding.py
      - name: スキルの references/ に切れリンク・孤児・未許可の2ホップ参照が無いこと
        run: python tools/ci/check_skill_references.py
      # 列挙は install.py の _discover_all_skills / _discover_core_skills に任せ、
      # README.md のスキル一覧（常時ロード・件数・表・見出しの重複）と突き合わせる。
      - name: 文書のスキル目録が実体と一致すること
        run: python tools/ci/check_skill_catalog.py
      # git-skill-manager の generated/skill-catalog.json を、install.py の列挙で
      # 生成し直した結果と突き合わせる。古ければ --write で生成し直してコミットする。
      - name: 生成済みスキルカタログが実体と一致すること
        run: python tools/ci/check_generated_skill_catalog.py
      # skill-evaluator スキル同梱の検査器を、リポジトリ内のパスを直接叩いて回す
      # （install.py が ~/.agents/ へ配る写しには依存しない）。落ちるのはエラー
      # だけで、description の字数超過などの警告では落ちない設計——警告も落とす
      # 厳しさにするのは、いま残っている警告を 0 にしてから。
      - name: スキルの frontmatter に未知のキーが無いこと
        run: python .github/skills/skill-evaluator/scripts/quality_check.py --path .github/skills
      - name: 依存（Dagu のワークフローの例の読み込み）
        run: python -m pip install pyyaml
      # 各ツールの dags/*.example.yaml（Dagu のワークフローの例）が、コピーしてそのまま置ける形か。
      - name: Dagu のワークフローの例が崩れていないこと
        run: python tools/ci/check_dagu_examples.py
      - name: 検査自身の単体テスト
        run: python -m unittest discover -s tools/ci/tests
