<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SVG クリップ画像エディタ デモ</title>
  <link rel="stylesheet" href="../src/style.css">
  <style>
    body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: #f6f8fa; color: #1f2328; }
    .page { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; padding: 16px; max-width: 1200px; margin: 0 auto; }
    .card { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .sub { color: #656d76; font-size: 12px; }
    .preview { width: 100%; height: auto; border: 1px solid #d0d7de; border-radius: 6px; }
    select { font: inherit; }
    @media (max-width: 800px) { .page { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="dist/main.js"></script>
</body>
</html>
